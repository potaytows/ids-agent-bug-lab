services:
  mysql:
    image: mysql:8.4
    container_name: faultymart-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: faultymart
      MYSQL_USER: ${DB_USER:-faultymart_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-faultymart_app_local_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-faultymart_root_local_only}
    command:
      - --mysql-native-password=ON
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - faultymart-mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro

volumes:
  faultymart-mysql-data:
